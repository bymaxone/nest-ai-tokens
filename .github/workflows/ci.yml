# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic library jobs (lint, typecheck, unit + coverage, mutation) run via
# node-lib-ci.yml so every repo shares one definition. This library's JSDoc gate,
# architecture guards (no provider SDK imports, zero-dependency shared layer, no
# float math on money paths), build-output integrity across its five subpaths,
# bundle-size budget, verified-secret scan, and its Testcontainers Postgres+Redis
# e2e stay here. Mutation runs only on a push to main / manual dispatch, never on
# PRs. The Prisma client is generated automatically by the `prepare` lifecycle
# hook on install, so no explicit generate step is needed.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-lib-ci.yml@v1
    with:
      run-format-check: false # no format:check script; prettier runs via lint/pre-commit
      run-build: false # build + integrity + size verified in the `verify` job below
      unit-command: pnpm test:cov # unit coverage (100% per implemented file); e2e runs separately
      run-mutation: true
      mutation-source-globs: '^(src/)'

  verify:
    name: Verify build + size
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: JSDoc coverage + docs fixture type-check
        run: pnpm docs:check
      - name: Reject provider SDK imports (normalizer-first)
        run: |
          if grep -rnE "from '(openai|@anthropic-ai/sdk|@google/genai|@mistralai)" src/; then
            echo "Found a provider SDK import in src/ — normalizers must consume plain objects."
            exit 1
          fi
          echo "No provider SDK imports present."
      - name: Enforce zero-dependency shared layer
        run: |
          if grep -rnE '@nestjs|@prisma|ioredis' src/shared/; then
            echo "Found a framework/peer import under src/shared/ — it must stay zero-dependency."
            exit 1
          fi
          echo "src/shared stays zero-dependency."
      - name: Reject float math on money paths
        run: |
          if grep -rnE '\bparseFloat\(|\btoFixed\(' src/shared/pricing src/server/services 2>/dev/null; then
            echo "Found float math on a money path — all persisted money is bigint nano-USD."
            exit 1
          fi
          echo "No float math on money paths."
      - name: Build all subpaths
        run: pnpm build
      - name: Verify build output integrity
        run: |
          for subpath in server shared prices prisma redis; do
            for ext in mjs cjs d.ts d.cts; do
              if [ ! -f "dist/$subpath/index.$ext" ]; then
                echo "Missing dist/$subpath/index.$ext"
                exit 1
              fi
            done
          done
          echo "All five subpaths produced ESM + CJS + .d.ts"
      - name: Verify published type resolution
        # A source-level typecheck compiles `src`, so it cannot catch a broken
        # `exports` map: a consumer resolving through the packed tarball may still
        # land on declarations for the wrong module format. `attw` packs the
        # tarball and resolves every entry point the way each resolution mode does.
        run: pnpm check:exports
      - name: Consumer runtime
        # Entry points are separate bundles, so a class both reach by a relative
        # path is copied into each — and a copied class is a different `instanceof`
        # target. The unit suite maps the specifiers to `src` and sees one copy, so
        # only a gate against the packed tarball can observe the split.
        run: pnpm check:runtime
      - name: Bundle size budget
        run: pnpm size

  e2e:
    name: E2E (Testcontainers + PostgreSQL + Redis)
    # Gate behind verify too: skip the ~25 min Testcontainers run on any PR that
    # already failed a fast gate (docs / arch guards / build / size).
    needs: [ci, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Pre-pull pinned images (cache for Testcontainers)
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
      - name: E2E tests
        run: pnpm test:e2e

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --only-verified

  security:
    # Dependency review needs the dependency graph (public repos, or private + GHAS).
    # Gated on visibility so it starts running automatically once this repo is public.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high
