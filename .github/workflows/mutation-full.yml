# The full cold mutation run. The logic lives once in `bymaxone/.github`; what stays here is
# what is genuinely local: when it runs and how long it may take.
#
# Why it exists: `stryker.config.json` sets `incremental: true`, so the per-push job re-tests
# only what changed and finishes inside the minutes a routine gate is allowed to take. That is a
# trade — an incremental run reuses stored verdicts, and reused verdicts for STATIC mutants can
# be stale. The fast signal is here every push; the truth is measured cold, once a week.
name: Mutation (full)

on:
  schedule:
    # Off the working day, and staggered against the other libraries so a Monday morning does
    # not start ten cold suites at once.
    - cron: '13 3 * * 1'
  workflow_dispatch:

# Single-flight across the whole repository, deliberately NOT keyed by `github.ref`
# — the same reasoning `peer-advisory-drift.yml` here already carries. What two runs
# would race over is one shared incremental baseline, so a ref-scoped group would put
# a dispatch and the scheduled run in different groups and leave the race intact.
# Queue rather than cancel: a cold run killed halfway leaves no baseline at all,
# which is worse than a second run waiting for the first.
concurrency:
  group: mutation-full
  cancel-in-progress: false

permissions:
  contents: read
  # The reusable reads `gh run list` to decide whether anything can have moved the score.
  actions: read

jobs:
  full:
    uses: bymaxone/.github/.github/workflows/mutation-full.yml@v1
    with:
      # The ceiling is per shard job. A shard costs about (static mutants x its dry-run seconds x 2.2 +
      # other mutants x 1 s) / test runners, because each static mutant re-runs the whole suite. Hosted
      # runners vary 1.9x on the same work (27.5 s to 53.2 s net dry run), and the planner balances by
      # test executions without weighing static mutants, so shard times spread widely on equal
      # weights. Measured on eight shards at concurrency 2: the shards took 31 to 104 minutes, the
      # slowest 104. A ceiling that cuts a shard loses the whole run, so it is 1.5 times the slowest
      # measured shard, rounded up to 160. Re-measure and move it when the suite or the shard count
      # changes.
      timeout-minutes: 160
      # A unit spec the mutation run did not run fails the job; the one spec that reads source text
      # instead of executing it is listed with its reason in scripts/mutation-inventory.exempt.json.
      inventory: enforce
      # Eight shards at concurrency 2: with the checker, each runs 1 checker and 1 test runner, then
      # 2 runners once checking ends. The cold run grows with the suite, so it is split across runners
      # instead of given a longer one. A test runner grows to several GiB over a long run and the
      # hosted runner has 16 GB, so two of them and their parent are what one runner holds. The count
      # and the concurrency are passed here, not written into stryker.config.json, which the per-push
      # incremental job and local runs share.
      # The static mutants (about 6% of the mutants, about 71% of the test time) each re-run the whole
      # suite, and 69% of that static cost sits in three places: the seed table (100 mutants),
      # prisma/sql.ts (50) and the error messages (16).
      shards: 8
      concurrency: 2
