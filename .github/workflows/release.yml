name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only publish from a semver tag — a manual workflow_dispatch on a branch must never publish.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@bymax-one/nest-ai-tokens
    permissions:
      contents: write # gh release create
      id-token: write # npm OIDC Trusted Publishing — exchanges OIDC for a short-lived token; no NPM_TOKEN secret
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Release gate
        run: pnpm prepublishOnly # typecheck · lint · 100% coverage · build · size

      - name: Publish with provenance (OIDC)
        run: pnpm publish --provenance --no-git-checks

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
