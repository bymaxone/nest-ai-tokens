name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only publish from a semver tag — a manual workflow_dispatch on a branch must never publish.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@bymax-one/nest-ai-tokens
    permissions:
      contents: write # gh release create
      id-token: write # npm OIDC Trusted Publishing — exchanges OIDC for a short-lived token; no NPM_TOKEN secret
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Release gate
        run: pnpm prepublishOnly # typecheck · lint · 100% coverage · build · size

      - name: Verify published type resolution
        # Runs after the build inside prepublishOnly and before the publish, so a
        # tag cannot ship a tarball whose `exports` map resolves to declarations
        # for the wrong module format.
        #
        # It cannot live in prepublishOnly: attw packs the tarball itself, and a
        # pack nested inside a publish resolves to a path that does not exist —
        # `ENOENT: bymax-one-<pkg>-<version>.tgz`.
        run: pnpm check:exports

      - name: Consumer load
        # Same reason it is a step rather than a prepublishOnly entry: it packs
        # the tarball to inspect it, and the nested pack fails inside a publish.
        run: pnpm check:runtime

      - name: Publish with provenance (OIDC)
        # `npm publish`, not `pnpm publish`. The registry's `readme` field is
        # populated from the publish request, and pnpm 11 does not send it: every
        # package in this family published under pnpm 11 carries an empty `readme`,
        # while every one published under pnpm 10 — which delegated to the npm CLI
        # — carries it. The same split shows in `_npmVersion`, present only on the
        # publishes the npm CLI performed. An empty `readme` renders the npm package
        # page with no documentation at all, which is where people actually read it.
        # It already cost this family two corrective patch releases.
        #
        # `--ignore-scripts`: npm runs `prepublishOnly` on publish, and this job
        # already ran it as its own step. Without the flag it runs twice, and the
        # second run starts by cleaning — deleting and rebuilding the `dist/` the
        # gates just validated, so the tarball shipped is not the artifact checked.
        #
        # `--access public` replaces pnpm's `--no-git-checks`: npm performs no git
        # check on publish, and the scope needs an explicit public access flag.
        run: npm publish --provenance --access public --ignore-scripts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
