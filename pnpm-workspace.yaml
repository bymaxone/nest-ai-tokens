# Build scripts are denied by default; an unlisted package counts as unreviewed.
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. Without an entry, `pnpm install` exits with ERR_PNPM_IGNORED_BUILDS
# rather than warning.
allowBuilds:
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true
  # Denied on purpose: optional native builds reached transitively that
  # nothing here executes. Recording them as `false` states the decision,
  # where leaving them out would only state that nobody looked.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # jest-haste-map 30.5.0 pulls @parcel/watcher in, where 30.4.1 did not. It
  # only speeds up the file crawl behind `jest --watch`, and jest falls back to
  # its own polling watcher without it. `test:watch` exists in package.json,
  # but no CI job and no git hook invokes it, so denying the native build
  # costs nothing here.
  '@parcel/watcher': false
# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so
# an override placed there does nothing — it warns, but it does nothing.
overrides:
  # GHSA-5p4m-2wfm-xmqj (CVSS 7.5) — quadratic CPU while resolving !!omap.
  # Transitive and build-time only; patched rather than ignored, because a
  # scanner told to skip dev dependencies stays blind after this one is gone.
  #
  # GHSA-2883-xcg3-v3hh (CVSS 7.5) — fixed in 3.15.2 and 4.3.2.
  'js-yaml@3': '^3.15.2'
  'js-yaml@4': '^4.3.2'
  # GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7 (CVSS 7.5 each), GHSA-q2hr-2g5m-vwhr
  # (CVSS 5.3). The floors are the release that fixes all three on each major line.
  'brace-expansion@1': '^1.1.21'
  'brace-expansion@2': '^2.1.7'
  'brace-expansion@5': '^5.0.12'
  # GHSA-27r3-jxmh-p828 (CVSS 7.5) — fixed in 2.4.0. Reached through express under the
  # dev-only @nestjs/platform-express; express's caret range admits the fix without
  # requiring it, so this floor is what forces it.
  'body-parser@2': '^2.4.0'
  # GHSA-ggr8-5vv4-36mx (CVSS 8.2) — merging two records that both self-reference
  # at the same key recurses without cycle detection until the stack is exhausted.
  # Reached transitively through @prisma/config, which parses prisma.config.ts, so
  # the range cannot be raised from package.json. Build-time only — @prisma/config
  # arrives under the `prisma` CLI and this package ships no runtime dependencies,
  # so nothing here reaches a consumer install.
  # GHSA-73wf-gq98-2v4g and GHSA-c83g-rgw3-j3cx (CVSS 7.5 each) — a prototype
  # write while normalising an untrusted browserslist-stats.json, and a query
  # cache that never evicts until the process runs out of memory. Both are fixed
  # in 4.28.7. Reached transitively through @babel/helper-compilation-targets
  # under @babel/core, which arrives by two dev paths — Stryker's instrumenter
  # and babel-jest — so the range cannot be raised from package.json. That
  # package asks for ^4.24.0, and no other declared range caps the ceiling.
  'browserslist': '^4.28.7'
  'deepmerge-ts': '^8.0.0'
  'esbuild': '0.28.1'
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf and
  # GHSA-jqff-g426-hqxp (CVSS 7.5 each) — a scheme-relative reference skips IDN
  # canonicalisation, so two different hosts compare equal. Fixed in 3.1.6.
  # The floor was ^3.1.4, which admitted 3.1.6 but did not require it: ajv 8.20.0
  # under the Prisma CLI resolved 3.1.6 while ajv 8.18.0 under Stryker stayed on
  # 3.1.5, so the tree carried both and only the older edge was vulnerable.
  # GHSA-58mr-gqgx-xq4g and GHSA-qw65-cvwx-89v3 (CVSS 7.5 each, fixed in 3.1.7) and
  # GHSA-hrr3-gc8f-f4qj (CVSS 4.8, fixed in 3.1.8): the floor is the later release.
  'fast-uri': '^3.1.8'
  # GHSA-8r5x-fm3f-whwj (CVSS 9.8), GHSA-p8wg-vrv2-v86f (CVSS 9.2) and
  # GHSA-xw65-4hp5-5hc7 (CVSS 4.7), all fixed in 4.7.10. A direct dependency of
  # ts-jest; build-time only.
  'handlebars': '^4.7.10'
  # GHSA-535w-7cp7-47q4, GHSA-qfvm-cv95-jqjf and GHSA-wc9g-mqfw-jrwm (CVSS 7.5 each),
  # GHSA-3pph-fpjx-jg34, GHSA-qvfw-j98x-7q72 and GHSA-q7qp-rjg7-q26m (CVSS 7.5); the
  # last fix is in 2.5.0.
  # @nestjs/platform-express pins multer to an exact version, so only an override can
  # lift it. A caret, not an exact pin: an exact pin would refuse the next fix the same
  # way. platform-express is a devDependency here, not a peer.
  'multer': '^2.5.0'
  # GHSA-jqcg-44mw-7w3h (CVSS 9.1) — fixed in 2.0.8. Reached through express under the
  # dev-only @nestjs/platform-express. Express's own caret range admits the fixed
  # release without requiring it, so this floor is what forces it.
  'proxy-addr': '^2.0.8'
  # GHSA-m9gg-hp2v-232j (CVSS 7.4) and GHSA-f596-whhp-79r4 (CVSS 3.7) — fixed in
  # 1.14.5. Reached through the Testcontainers e2e stack; build-time only.
  '@grpc/grpc-js': '^1.14.5'
  # GHSA-3f6p-5ww8-9rcr (CVSS 8.2) — a hostile server can downgrade the auth
  # plugin to mysql_clear_password and read the credentials in plaintext; fixed
  # in 3.22.0. GHSA-rgwj-5xj2-c3m3 — the compressed-protocol handler inflates
  # without bounding the output, so a decompression bomb exhausts memory; fixed
  # only in 3.23.1. The floor is the LATER of the two: ^3.22.0 would clear the
  # first advisory and leave the scan red on the second.
  #
  # Build-time only, and not reachable from a consumer install: mysql2 is a
  # dependency of the `prisma` CLI (a devDependency here, never a peer), not of
  # @prisma/client, which is the optional peer this package actually exposes.
  # With `dependencies: {}` and only `dist/` published, nothing pulls it. This
  # project's datasource is postgresql, so no MySQL connection is ever opened.
  'mysql2': '^3.23.1'
  'protobufjs': '^7.6.5'
  # GHSA-4mjr-xmp4-gh2g and GHSA-x5fp-wj9c-mxmx (CVSS 6.3 each) — an
  # attacker-controlled `isBuffer` makes parsing degrade into a denial of service.
  # Fixed in 6.16.0. This entry was an exact pin at 6.15.2 carried over from the
  # initial scaffold; an exact pin refuses the fix rather than merely failing to
  # require it, so it is a caret now, matching the other security floors here.
  # GHSA-6pq8-jhm2-2vcw (CVSS 6.3) is fixed in 6.16.1, the floor below. Reached through
  # body-parser under the dev-only @nestjs/platform-express.
  'qs': '^6.16.1'
  # Eleven advisories are first fixed in 8.10.2; the most severe are
  # GHSA-rfgv-xxqx-mfg5 (CVSS 7.5), GHSA-w293-vg96-wgc3 and GHSA-vp8m-p9jh-q5pm
  # (CVSS 7.4 each).
  'undici': '^8.10.2'
  'uuid': '11.1.1'
  # GHSA-mrhx-c7xc-m3w5 (CVSS 8.2) — fixed in 4.6.6. Reached through
  # mutation-server-protocol under @stryker-mutator/core; build-time only.
  'zod@4': '^4.6.6'
