# Build scripts are denied by default; an unlisted package counts as unreviewed.
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. Without an entry, `pnpm install` exits with ERR_PNPM_IGNORED_BUILDS
# rather than warning.
allowBuilds:
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true
  # Denied on purpose: optional native builds reached transitively that
  # nothing here executes. Recording them as `false` states the decision,
  # where leaving them out would only state that nobody looked.
  cpu-features: false
  protobufjs: false
  ssh2: false
# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so
# an override placed there does nothing — it warns, but it does nothing.
overrides:
  # GHSA-5p4m-2wfm-xmqj (CVSS 7.5). Reaches this repo only through
  # jest -> babel-plugin-istanbul -> @istanbuljs/load-nyc-config. THIS package declares
  # `"dependencies": {}`, so js-yaml is never installed beside it and no consumer is
  # exposed; the reach is the local and CI toolchain. Floored at the patched release of
  # each major rather than excluded from the scan — a scanner told to ignore dev
  # dependencies would stay blind after this advisory is gone. The carets accept later
  # releases of the same major; what the override fixes is the floor, not the version.
  'js-yaml@3': '^3.15.1'
  'js-yaml@4': '^4.3.1'
  'brace-expansion@1': '^1.1.17'
  'brace-expansion@2': '^2.1.3'
  'brace-expansion@5': '^5.0.8'
  'esbuild': '0.28.1'
  'fast-uri': '^3.1.4'
  'multer': '2.2.0'
  'protobufjs': '^7.6.5'
  'qs': '6.15.2'
  'undici': '^8.9.0'
  'uuid': '11.1.1'
